[package]
name = "tui-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui      = "0.26"
crossterm    = "0.27"
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.11", features = ["json", "stream"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
futures-util = "0.3"
anyhow       = "1"

